# Lokal starten: docker compose up --build
# Danach: http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stempelei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stempelei}
      POSTGRES_DB: stempelei
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stempelei -d stempelei"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      # Zum Ausprobieren ohne Mail-Zugang NODE_ENV=development in .env setzen, dann stehen die Mails im Log
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://stempelei:${POSTGRES_PASSWORD:-stempelei}@db:5432/stempelei
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Apple und Google Wallet, optional. Schlüsseldateien liegen in ./secrets (nicht im Repo).
      APPLE_PASS_TYPE_ID: ${APPLE_PASS_TYPE_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_PASS_CERT: ${APPLE_PASS_CERT:-}
      APPLE_PASS_KEY: ${APPLE_PASS_KEY:-}
      APPLE_PASS_KEY_PASSPHRASE: ${APPLE_PASS_KEY_PASSPHRASE:-}
      APPLE_WWDR_CERT: ${APPLE_WWDR_CERT:-}
      WALLET_SECRET: ${WALLET_SECRET:-}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_KEY_FILE: ${GOOGLE_WALLET_KEY_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
