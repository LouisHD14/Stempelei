name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stempelei
          POSTGRES_PASSWORD: stempelei
          POSTGRES_DB: stempelei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stempelei -d stempelei_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://stempelei:stempelei@localhost:5432/stempelei_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint und Format
        run: npm run check
      - name: Typen
        run: npm run typecheck
      - name: Migrationen passen zum Schema
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "Schema geändert, aber keine Migration erzeugt: npm run db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "Neue Migration fehlt im Commit: npm run db:generate" && exit 1)
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Sicherheitsprüfung (Produktionsabhängigkeiten)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Image bauen
        run: docker build -t stempelei:ci .
