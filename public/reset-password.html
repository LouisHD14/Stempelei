<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="common.neues-passwort-stempelei">Neues Passwort · Stempelei</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="reset-password">
<div class="banner"><div class="container"><a href="/register" data-i18n="common.jedes-paket-14-tage-kostenlos-testen">Jedes Paket 14 Tage kostenlos testen</a></div></div>
<header class="bar">
  <div class="container">
    <a class="brand" href="/" aria-label="Stempelei, zur Startseite" data-i18n-attr="aria-label:common.aria-label-stempelei-zur-startseite">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 11l4 8.2 9 1.2-6.5 6.3 1.6 9L24 31.4 15.9 35.7l1.6-9L11 20.4l9-1.2z" fill="currentColor"/></svg>
      Stempelei
    </a>
    <nav class="nav" aria-label="Hauptmenü" data-i18n-attr="aria-label:common.aria-label-hauptmenue">
      <a href="/" data-nav="/" data-i18n="common.start">Start</a>
      <a href="/pricing" data-nav="/pricing" data-i18n="common.preise">Preise</a>
      <a href="/login" data-nav="/login" data-i18n="common.anmelden">Anmelden</a>
    </nav>
    <button class="lang-switch" type="button" data-lang-switch aria-label="Switch to English" lang="en">EN</button>
    <a class="btn btn--ink btn--s bar-cta" href="/register" data-i18n="common.kostenlos-testen">Kostenlos testen</a>
  </div>
</header>

<main class="app">
  <div class="container">
    <section class="auth stock" aria-labelledby="h-auth">
      <h1 id="h-auth" data-i18n="auth.neues-passwort">Neues Passwort</h1>
      <form id="form" novalidate>
        <div class="field"><label for="password" data-i18n="auth.neues-passwort">Neues Passwort</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="200" aria-describedby="pwHelp"><p class="help" id="pwHelp" data-i18n="auth.mindestens-10-zeichen">Mindestens 10 Zeichen.</p></div>
        <button class="btn btn--ink" type="submit" data-i18n="auth.passwort-speichern">Passwort speichern</button>
      </form>
      <a class="btn btn--card" id="next" href="/login" hidden data-i18n="auth.zur-anmeldung">Zur Anmeldung</a>
      <p class="flash" id="flash" role="status" aria-live="polite"></p>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="container">
    <p><span class="brandline">Stempelei.</span> <span data-i18n="common.digitale-stempelkarten-fuer-restaurants">Digitale Stempelkarten für Restaurants, Cafés und Läden.</span> <a href="/imprint" data-i18n="common.impressum">Impressum</a> · <a href="/privacy" data-i18n="common.datenschutz">Datenschutz</a></p>
  </div>
</footer>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/account.js"></script>
</body>
</html>
