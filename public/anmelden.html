<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anmelden · Stempelei</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="anmelden">
<header class="bar">
  <div class="container">
    <a class="brand" href="/" aria-label="Stempelei, zur Startseite">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 11l4 8.2 9 1.2-6.5 6.3 1.6 9L24 31.4 15.9 35.7l1.6-9L11 20.4l9-1.2z" fill="currentColor"/></svg>
      Stempelei
    </a>
  </div>
</header>
<main class="app">
  <div class="container">
    <section class="auth stock" aria-labelledby="h-auth">
      <h1 id="h-auth">Anmelden</h1>
      <form id="form" novalidate>
        <div class="field"><label for="email">E-Mail-Adresse</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
        <div class="field"><label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"></div>
        <button class="btn btn--ink" type="submit">Anmelden</button>
      </form>
      <button class="btn btn--card btn--s" id="resend" type="button" hidden>Bestätigungslink neu senden</button>
      <p class="muted"><a href="/passwort-vergessen">Passwort vergessen?</a> · Noch kein Konto? <a href="/registrieren">Konto anlegen</a></p>
      <p class="flash" id="flash" role="status" aria-live="polite"></p>
    </section>
  </div>
</main>
<script src="/assets/js/konto.js"></script>
</body>
</html>
